name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAD_INTAKE_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build
      - name: Install pinned browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/yob-browser" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.62.1
          node "$RUNNER_TEMP/yob-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Browser QA at 320, 390, 768 and 1440 px
        run: YOB_PLAYWRIGHT_MODULE="$RUNNER_TEMP/yob-browser/node_modules/playwright" node scripts/quote-browser-test.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quote-browser-qa
          path: .sites-runtime/browser-qa/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
